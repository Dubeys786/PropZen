spring:
  datasource:
    url: jdbc:h2:mem:propzen_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

propzen:
  environment: test
  app:
    version: "1.0.0-TEST"
    name: "PropZen Backend Test"
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080
  supabase:
    jwt:
      secret: "propzen-test-super-secret-hmac-key-256-bits-minimum-length-2026"
      validate-audience: true
  security:
    bootstrap-admin-emails: "admin@propzen.ai"
  whatsapp:
    webhook-verify-token: "propzen-webhook-verify-token-2026"
    app-secret: "test-meta-hub-secret-2026"
  ai:
    provider: LOCAL
    cache-enabled: true
    rate-limit-per-minute: 1000
    safety-checks-enabled: true

logging:
  level:
    root: WARN
    com.propzen: INFO
